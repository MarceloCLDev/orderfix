query CartTransformRunInput {
  shop {
    metafield(namespace: "custom", key: "autoapply") {
      value
    }
  }

  cart {
    lines {
      id
      quantity

      customPrice: attribute(key: "_custom_price") {
        value
      }

      mysteryGift: attribute(key: "_mystery_gift") {
        value
      }

      giftPromo: attribute(key: "_gift_promo") {
        value
      }

      merchandise {
        __typename
        ... on ProductVariant {
          id
        }
      }
    }
  }
}